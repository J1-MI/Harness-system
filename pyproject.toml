[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Executable contract kernel for the Agent Harness (Phase 1.1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
claude = [
    "claude-agent-sdk>=0.2,<0.3",
]
codex = [
    "openai-codex>=0.144,<0.145",
]
cli = [
    "typer>=0.12,<1",
]

[project.scripts]
harness = "agent_harness.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
